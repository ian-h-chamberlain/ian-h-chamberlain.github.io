[[project]]
name = "corewa-rs"
desc = """
A partial implementation of [Core War](https://en.wikipedia.org/wiki/Core_War),
a programming battle game, in Rust. It can load and assemble redcode programs
(warriors), as well as run a single warrior in a Memory Array Redcode Simulator
(MARS).

`vscode-redcode` is a companion VSCode extension for syntax highlighting Redcode,
the assembly language used for writing warriors.
"""
tags = ["rust", "redcode", "mars"]
links = [
  { name = "corewa.rs", url = "https://corewa.rs/" },
  { name = "vscode-redcode", url = "https://marketplace.visualstudio.com/items?itemName=corewa-rs.redcode" },
  { name = "GitHub", url = "https://github.com/corewa-rs/corewars" },
]
