A game made in nine days for the [Godot Wild Jam #57](https://itch.io/jam/godot-wild-jam-57)
(theme: "forgotten knowledge"), and also my first time making a game with Godot!

In this game, you seek to rediscover the lost powers of the constellations.
First, find spells by drawing constellations in the night sky. Later, you can
draw the same shapes to cast those spells. Blast apart the incoming asteroids
to protect the planet!

Ranked 14 / 46 for originality and 25 / 46 overall.
