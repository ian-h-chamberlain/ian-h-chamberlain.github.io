[[project]]
name = "codemirror-tree-sitter"
desc = """[{{
    image(
        alt="",
        title="Pist Off",
        path="/images/codemirror.png",
        width=200
    )
}}](https://ian-h-chamberlain.com/codemirror-tree-sitter)

An adapter library for syntax highlighting on the web. The adapter provides
a way to translate Wasm tree-sitter grammars into [Lezer](https://lezer.codemirror.net)
parsers, which can be plugged into [CodeMirror](https://codemirror.net) and used
like for highlighting.

This offers a way to add highlighting to CodeMirror for languages that aren't
already supported, but do have an existing tree-sitter grammar.

The demo shows syntax highlighting for [Nushell](https://www.nushell.sh)
by adapting the [tree-sitter-nu](https://github.com/nushell/tree-sitter-nu)
"""
tags = ["nushell", "tree-sitter", "highlight"]
links = [
  { name = "demo", url = "https://ian-h-chamberlain.com/codemirror-tree-sitter" },
  { name = "github", url = "https://github.com/ian-h-chamberlain/codemirror-tree-sitter" },
]

