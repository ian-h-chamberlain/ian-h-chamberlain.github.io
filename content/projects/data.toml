A game I made in nine days for [Bevy Jam #3](https://itch.io/jam/bevy-jam-3)
(theme: "side effects") with the [Bevy Game Engine](https://bevyengine.org).

The objective of the game is to push each colored block back into place inside
the cube --- but doing so can cause unwanted side effects. Once all the blocks
are in place, the difficulty will increase and the next level begins.

Ranked 15 / 78 for theme interpretation and 26 / 78 overall.
"""
